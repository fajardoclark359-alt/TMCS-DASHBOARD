# Render Blueprint — https://render.com/docs/blueprint-spec
# Postgres databases must be declared under the root-level `databases:` key,
# not as entries in `services:`. Everything else (web, worker, keyvalue,
# static site) belongs in `services:`.

databases:
  - name: auosint-db
    databaseName: auosint
    user: auosint
    plan: free
    region: singapore
    ipAllowList: [] # Private network only

services:
  # Render Key Value (Redis-compatible) for Celery
  - type: keyvalue
    name: auosint-redis
    plan: free
    region: singapore
    ipAllowList: [] # Private network only
    maxmemoryPolicy: allkeys-lru

  # Backend API
  - type: web
    name: advance-ultimate-osint-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    region: singapore
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: auosint-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: auosint-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: auosint-redis
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://advance-ultimate-osint-frontend.onrender.com
      - key: API_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true

  # Celery Worker (Background Tasks)
  - type: worker
    name: auosint-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.celery_app worker --loglevel=info --concurrency=4
    region: singapore
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: auosint-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: auosint-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: auosint-redis
          property: connectionString

  # Celery Beat (Scheduled Tasks)
  - type: worker
    name: auosint-beat
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.celery_app beat --loglevel=info
    region: singapore
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: auosint-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: auosint-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: auosint-redis
          property: connectionString

  # Frontend (Static Site)
  - type: web
    name: advance-ultimate-osint-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://advance-ultimate-osint-api.onrender.com
      # Keep the SPA in sync with the API's generated key. Note that any value
      # baked into a static bundle is publicly readable, so this only stops
      # casual/automated abuse — it is not a true secret.
      - key: VITE_API_KEY
        fromService:
          type: web
          name: advance-ultimate-osint-api
          envVarKey: API_KEY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
