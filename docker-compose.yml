# Production docker-compose - Use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Development: docker-compose up --build

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: auosint-postgres
    environment:
      POSTGRES_DB: auosint
      POSTGRES_USER: auosint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auosint -d auosint"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auosint-network

  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: auosint-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auosint-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auosint-backend
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://auosint:changeme@postgres:5432/auosint
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - ALLOWED_ORIGINS=https://your-domain.com,http://localhost:3000
      - API_KEY=${API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-changeme}
      - SHODAN_API_KEY=${SHODAN_API_KEY:-}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - CENSYS_API_ID=${CENSYS_API_ID:-}
      - CENSYS_API_SECRET=${CENSYS_API_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - auosint-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Celery Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auosint-worker
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://auosint:changeme@postgres:5432/auosint
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - auosint-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Celery Beat (Scheduler)
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auosint-beat
    command: celery -A app.celery_app beat --loglevel=info
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://auosint:changeme@postgres:5432/auosint
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - auosint-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_KEY: ${API_KEY:-}
    container_name: auosint-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - auosint-network
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: auosint-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - auosint-network
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  nginx_cache:

networks:
  auosint-network:
    driver: bridge